[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]
exclude = [".git", ".venv", "venv", "__pycache__", ".ruff_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ANN", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"lab1.py" = ["T201"]
"test_lab1.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space" 